name: Cypress Tests

on:
  push:
    branches:
      - testes

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Server BackEnd
        # <-- CORREÇÃO: A propriedade abaixo já faz o 'cd server' para você.
        working-directory: server
        run: |
          # <-- CORREÇÃO: Esta linha foi removida.
          # cd server 

          npm install
          npm run compile
          npm start &
          
          echo "Waiting for server to start..."
          timeout=60
          counter=0
          until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)" == "200" ]; do
            if [ $counter -ge $timeout ]; then
              echo "Server failed to start within $timeout seconds"
              ps aux | grep node
              exit 1
            fi
            echo "Waiting for server to start... ($counter/$timeout)"
            sleep 2
            counter=$((counter + 2))
          done
          echo "Server is running successfully."

      - name: Start Web App FrontEnd
        # <-- CORREÇÃO: Adicionamos a propriedade working-directory para o frontend.
        working-directory: web
        run: |
          # <-- CORREÇÃO: Esta linha foi removida.
          # cd web
          
          npm install
          npm start &
          
          echo "Waiting for frontend to start..."
          timeout=60
          counter=0
          until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)" == "200" ]; do
            if [ $counter -ge $timeout ]; then
              echo "Frontend failed to start within $timeout seconds"
              ps aux | grep node
              exit 1
            fi
            echo "Waiting for frontend to start... ($counter/$timeout)"
            sleep 2
            counter=$((counter + 2))
          done
          echo "Frontend is running successfully."

      - name: Verify Services are Running
        run: |
          echo "Verifying both services are accessible..."
          curl -f http://localhost:8080 && echo "✅ Backend (8080) is running"
          curl -f http://localhost:3000 && echo "✅ Frontend (3000) is running"
          echo "🎉 All services are ready for testing!"

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          spec: |
            cypress/e2e/cadastro-sucesso.cy.js
            cypress/e2e/login-api.cy.js
            cypress/e2e/dashboard.cy.js
          wait-on: 'http://localhost:3000,http://localhost:8080'