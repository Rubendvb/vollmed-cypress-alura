name: Cypress Tests

on:
  push:
    branches:
      - testes

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     containers: [1, 2]

    steps:
      - name: Checkout

        uses: actions/checkout@v4

      - name: Checkout

        uses: actions/checkout@v4

        with:
          path: server

      - name: Start API Server with Docker Compose
        run: |
          docker-compose up -d api
          # Wait for server to be ready
          timeout=60
          counter=0
          until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)" == "200" ]; do
            if [ $counter -ge $timeout ]; then
              echo "Server failed to start within $timeout seconds"
              docker-compose logs api
              exit 1
            fi
            echo "Waiting for server to start... ($counter/$timeout)"
            sleep 2
            counter=$((counter + 2))
          done
          echo "Server is running successfully."

      - name: Start Web App FrontEnd

        run: |

          cd web

          npm install

          npm start &

      - name: Run Cypress Tests

        uses: cypress-io/github-action@v6

        with:
          spec: |

            cypress/e2e/cadastro-sucesso.cy.js

            cypress/e2e/login-api.cy.js

            cypress/e2e/dashboard.cy.js

          wait-on: 'http://localhost:3000,http://localhost:8080'
          # record: true
          parallel: true
          ci-build-id: ${{ github.sha }}-${{ matrix.containers }}
          group: ${{ matrix.containers }}-containers
